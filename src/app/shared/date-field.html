<div class="ms-date" [class.is-open]="open()">
  <div class="ms-date-control" [class.is-invalid]="invalid()">
    <input
      [id]="controlId()"
      class="ms-date-input"
      type="text"
      inputmode="numeric"
      autocomplete="off"
      placeholder="dd/mm/aaaa"
      [attr.aria-label]="ariaLabel()"
      [attr.aria-invalid]="invalid() || null"
      [disabled]="formDisabled()"
      [value]="text()"
      (input)="onInput($any($event.target).value)"
      (blur)="onBlur()"
    />
    <button
      type="button"
      class="ms-date-toggle"
      aria-label="Abrir el calendario"
      [attr.aria-expanded]="open()"
      [disabled]="formDisabled()"
      (click)="toggle()"
    >
      <medsys-icon name="calendar" [size]="15" />
    </button>
  </div>

  @if (open()) {
    <div
      #panel
      class="ms-date-panel popover"
      tabindex="-1"
      role="dialog"
      aria-label="Elegir fecha"
      (keydown)="onPanelKey($event)"
    >
      <div class="ms-date-head">
        <button
          type="button"
          class="btn btn-ghost btn-sm btn-icon"
          [attr.aria-label]="pickingYear() ? 'Década anterior' : 'Mes anterior'"
          (click)="pickingYear() ? shiftYearPage(-1) : shiftMonth(-1)"
        >
          <medsys-icon name="chevrons-left" [size]="15" />
        </button>

        <button type="button" class="ms-date-title" (click)="pickingYear.set(!pickingYear())">
          {{ monthLabel() }}
          <medsys-icon name="chevron-down" [size]="13" />
        </button>

        <button
          type="button"
          class="btn btn-ghost btn-sm btn-icon"
          [attr.aria-label]="pickingYear() ? 'Década siguiente' : 'Mes siguiente'"
          (click)="pickingYear() ? shiftYearPage(1) : shiftMonth(1)"
        >
          <medsys-icon name="chevrons-right" [size]="15" />
        </button>
      </div>

      @if (pickingYear()) {
        <!-- La fecha que más se teclea aquí es una de nacimiento: llegar a 1958
             mes a mes sería inaceptable, así que los años van por décadas. -->
        <div class="ms-date-years">
          @for (year of years(); track year) {
            <button
              type="button"
              class="ms-date-year"
              [class.is-current]="year === cursor().getFullYear()"
              (click)="chooseYear(year)"
            >
              {{ year }}
            </button>
          }
        </div>
      } @else {
        <div class="ms-date-grid" role="grid">
          @for (weekday of weekdays; track weekday) {
            <span class="ms-date-weekday" aria-hidden="true">{{ weekday }}</span>
          }
          @for (day of days(); track day.iso) {
            <button
              type="button"
              class="ms-date-day"
              role="gridcell"
              [class.is-outside]="day.outside"
              [class.is-today]="day.today"
              [class.is-selected]="day.iso === value()"
              [disabled]="day.disabled"
              [attr.aria-selected]="day.iso === value()"
              (click)="select(day)"
            >
              {{ day.day }}
            </button>
          }
        </div>
      }
    </div>
  }
</div>
